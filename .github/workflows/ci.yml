name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск из вкладки Actions (полезно для проверки, пока нет событий на main)
  workflow_dispatch:

env:
  SOLANA_VERSION: stable
  ANCHOR_VERSION: 0.30.1
  NODE_VERSION: 22

# Least privilege: достаточно чтения контента + записи артефактов (upload-artifact).
# Не требует "Read and write permissions" на уровне репозитория.
permissions:
  contents: read
  actions: write

# Моноrepo: код, package.json и Anchor-проект лежат в game/
defaults:
  run:
    working-directory: game

jobs:
  program:
    name: Anchor program (build + unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            game/target
          key: ${{ runner.os }}-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('game/Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          if ! command -v anchor >/dev/null || [ "$(anchor --version | awk '{print $2}')" != "$ANCHOR_VERSION" ]; then
            cargo install --git https://github.com/coral-xyz/anchor avm --force
            avm install "$ANCHOR_VERSION"
            avm use "$ANCHOR_VERSION"
          fi
          anchor --version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: game/yarn.lock

      - name: yarn install (frozen)
        run: |
          set -o pipefail
          node --version; yarn --version
          if ! yarn install --frozen-lockfile --network-timeout 100000 2>&1 | tee /tmp/yarn-install.log; then
            echo "::error title=yarn-install-failed::$(tail -n 40 /tmp/yarn-install.log | tr '\n' ' | ' | head -c 6000)"
            exit 1
          fi

      - name: Unit tests (host)
        run: cargo test -p solana_potato --lib

      - name: anchor build
        run: anchor build

      - name: Upload build artifacts (.so + IDL)
        uses: actions/upload-artifact@v4
        with:
          name: program-build
          path: |
            game/target/deploy/solana_potato.so
            game/target/idl/solana_potato.json
            game/target/types/solana_potato.ts

      - name: IDL is committed and up to date
        run: |
          cp target/idl/solana_potato.json apps/web/src/idl.json
          git diff --exit-code -- apps/web/src/idl.json || (echo "::error::apps/web/src/idl.json is stale — run anchor build and commit it" && exit 1)

      - name: anchor test (local validator)
        run: |
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
          anchor test --skip-build

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: game/yarn.lock
      - name: yarn install (frozen)
        run: |
          set -o pipefail
          node --version; yarn --version
          if ! yarn install --frozen-lockfile --network-timeout 100000 2>&1 | tee /tmp/yarn-install.log; then
            echo "::error title=yarn-install-failed::$(tail -n 40 /tmp/yarn-install.log | tr '\n' ' | ' | head -c 6000)"
            exit 1
          fi
      - name: web typecheck
        run: |
          set -o pipefail
          if ! yarn workspace web exec tsc --noEmit 2>&1 | tee /tmp/tsc-web.log; then
            grep -E "^\S+\([0-9]+,[0-9]+\): error TS" /tmp/tsc-web.log \
              | sed -E 's/^([^(:]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' | head -40
            echo "::error title=tsc-web-failed::$(grep -cE 'error TS' /tmp/tsc-web.log) ошибок; хвост: $(tail -n 10 /tmp/tsc-web.log | tr '\n' ' | ' | head -c 3000)"
            exit 1
          fi
      - run: yarn workspace web build
        env:
          VITE_SOLANA_CLUSTER: devnet
          VITE_RPC_URL: https://api.devnet.solana.com
          VITE_PROGRAM_ID: DUUBiVvpbw5BbFLpryisvLGmBWmhVYC8tdf5xCUyEadf
          VITE_BACKEND_URL: ""
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: game/apps/web/dist

  backend:
    name: Backend + bot (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: game/yarn.lock
      - name: yarn install (frozen)
        run: |
          set -o pipefail
          node --version; yarn --version
          if ! yarn install --frozen-lockfile --network-timeout 100000 2>&1 | tee /tmp/yarn-install.log; then
            echo "::error title=yarn-install-failed::$(tail -n 40 /tmp/yarn-install.log | tr '\n' ' | ' | head -c 6000)"
            exit 1
          fi
      - name: backend typecheck
        run: |
          set -o pipefail
          if ! yarn workspace backend typecheck 2>&1 | tee /tmp/tsc-be.log; then
            grep -E "^\S+\([0-9]+,[0-9]+\): error TS" /tmp/tsc-be.log \
              | sed -E 's/^([^(:]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' | head -40
            echo "::error title=tsc-be-failed::$(grep -cE 'error TS' /tmp/tsc-be.log) ошибок; хвост: $(tail -n 10 /tmp/tsc-be.log | tr '\n' ' | ' | head -c 3000)"
            exit 1
          fi
      - run: yarn workspace bot build
