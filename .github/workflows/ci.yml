name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: '4.2.2'
  ANCHOR_VERSION: '0.31.2'

defaults:
  run:
    working-directory: game
    shell: bash

jobs:
  # F-22: одноразовый форматтер (только push-события на arena/**).
  # Срабатывает при наличии файла `.fmt-fix-requested` в корне репозитория:
  # `cargo fmt --all` (workspace game/ = programs/*), удаляет маркер и пушит
  # commit в ту же ветку. После применения снять baseline-гейт на строгий
  # `cargo fmt --all -- --check`. Ветка выбирается маркером, а не флагом
  # запуска: workflow_dispatch с non-default ветки невозможен (GitHub
  # резолвит workflow-файлы только с default-ветки).
  fmt-fix:
    name: Fmt remediation (marker-triggered)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Check marker
        id: marker
        working-directory: .
        run: |
          if [ -f .fmt-fix-requested ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, pinned (was @master)
        if: steps.marker.outputs.found == 'true'
        with:
          toolchain: '1.97.1' # тот же пин, что в job program (счёт fmt детерминирован)
          components: rustfmt
      - name: Format and push
        if: steps.marker.outputs.found == 'true'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd game && cargo fmt --all)
          rm .fmt-fix-requested
          git add game/ .fmt-fix-requested
          git config user.name "ARES-1 CI"
          git config user.email "ares1-ci@users.noreply.github.com"
          git commit -m "chore(program): cargo fmt --all — закрываем F-22 fmt-долг целиком"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Pushed formatting commit to ${GITHUB_REF_NAME}."

  offchain:
    name: Web + backend (typecheck, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: game/yarn.lock
      - run: npm install --global yarn@1.22.22
      - run: ./scripts/ci-local.sh --skip-chain
      # F-09/2026-10-02: HIGH and CRITICAL findings block. The previously
      # unresolved bigint-buffer native-addon issue is removed by the tested
      # local @solana/buffer-layout-utils backport (see game/apps/web/vendor/solana-buffer-layout-utils/README.vendor.md).
      # Yarn Classic returns a severity bitmask and --level only filters output,
      # so audit-blocking.sh checks bits 8/16 and fails closed on no audit summary.
      - name: Dependency audit — high/critical (blocking)
        run: ./scripts/audit-blocking.sh

  # Слой данных game_ops. Без этого джоба «append-only», «аудит» и «сверка»
  # остаются словами: здесь схема применяется на настоящем PostgreSQL, права
  # проверяются по факту, мутации (подмена строки, откат головы, снятие
  # триггера, расширение прав) обязаны быть пойманы детекторами, а нагрузочный
  # стенд печатает измеримые цифры в артефакт.
  gameops-db:
    name: game_ops DB (migrations, privileges, mutations, load)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ares1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ares1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GAME_OPS_TEST_URL: postgres://postgres:postgres@localhost:5432/ares1_test
      GAME_OPS_TEST_ROLE: game_ops_writer
      GAME_OPS_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: game/yarn.lock
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Unit layer (без БД)
        run: yarn test:db:unit
      - name: Миграции, роли и реестр версий
        run: |
          yarn db:migrate --url="$GAME_OPS_TEST_URL"
          # Повторный запуск обязан быть идемпотентным — иначе выкатка в двух
          # репликах ломается на второй.
          yarn db:migrate --url="$GAME_OPS_TEST_URL"
      - name: Интеграционные и мутационные тесты + приёмка
        # `yarn test:db` идёт с --test-concurrency=1: файлы делят ОДНУ базу, а часть
        # проб нарочно меняет глобальное состояние (дрейф сверки, права, триггеры).
        # Параллельный запуск давал ложные падения соседнего файла — это общий
        # стенд, а не изоляция БД.
        run: |
          set +e
          GAME_OPS_TEST_URL="$GAME_OPS_TEST_URL" yarn test:db 2>&1 | tee /tmp/db-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Логи job недоступны из API-окружений, а аннотации читаются: строки
            # падений уходят в аннотацию, чтобы причину было видно без скачивания.
            grep -E '^(not ok|# fail|# tests|error:|AssertionError)' /tmp/db-tests.log | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
      - name: Приёмка слоя данных (db:verify)
        run: yarn db:verify --url="$GAME_OPS_TEST_URL"
      - name: Нагрузочный стенд (артефакт с цифрами)
        run: |
          yarn db:bench --url="$GAME_OPS_TEST_URL" --rows=5000 --concurrency=8 --json=db-bench.json
      - name: Мутации с внешним якорем аудита
        run: |
          yarn db:mutate --url="$GAME_OPS_TEST_URL" --anchor=/tmp/audit-anchor.json --write-anchor
          yarn db:mutate --url="$GAME_OPS_TEST_URL" --anchor=/tmp/audit-anchor.json
      - name: Финальная приёмка после нагрузок
        run: yarn db:verify --url="$GAME_OPS_TEST_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: gameops-db-bench
          retention-days: 14
          if-no-files-found: warn
          path: game/db-bench.json

  program:
    name: Anchor program (build + unit + integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, pinned (was @master)
        with:
          toolchain: '1.97.1'
          # F-18: без этих компонентов шаги fmt/clippy завершаются «успехом»
          # (continue-on-error) с `error: 'cargo-clippy' is not installed`,
          # создавая иллюзию работающего гейта. Компоненты обязательны.
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: game/yarn.lock
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Install pinned Solana CLI
        run: |
          curl -fsSL "https://release.anza.xyz/v${SOLANA_VERSION}/install" -o /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: anchor-cache
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ env.ANCHOR_VERSION }}
      - name: Install pinned Anchor CLI
        run: |
          if ! command -v anchor >/dev/null || [[ "$(anchor --version | awk '{print $2}')" != "$ANCHOR_VERSION" ]]; then
            cargo install anchor-cli --version "=$ANCHOR_VERSION" --locked
          fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ steps.anchor-cache.outputs.cache-primary-key }}
      - name: Verify toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = '1.97.1'
          test "$(solana --version | awk '{print $2}')" = "$SOLANA_VERSION"
          test "$(anchor --version | awk '{print $2}')" = "$ANCHOR_VERSION"
          # Жёсткая проверка: advisory-шаги ниже не должны silently no-op'ить.
          cargo fmt --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: game
          cache-on-failure: true
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}
      - name: Unit tests (host)
        run: ./scripts/ci-run.sh cargo test --locked -p solana_potato --lib
      # F-22: fmt-долг закрыт целиком 2026-10-07 (job fmt-fix, commit a0b6da9 —
      # `cargo fmt --all` на пине rustfmt 1.97.1 из rust-toolchain.toml).
      # Теперь строгий гейт: файл обязан быть в rustfmt-формате. При нарушении
      # весь дифф публикуется аннотациями (fmt-inventory.py в report-режиме —
      # log-архив job недоступен из API-only окружений).
      - name: cargo fmt check (strict, F-22)
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt-check.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 scripts/fmt-inventory.py < /tmp/fmt-check.txt || true
          fi
          exit "$status"
      # F-22: clippy — блокирующий гейт. Единственное исключение — lint
      # `deprecated`, и оно точечное: предупреждение приходит не из нашего кода,
      # а из кодогена Anchor 0.31.2 (`#[program]` генерирует IDL-хендлеры,
      # которые зовут `AccountInfo::realloc(..)` — метод deprecated в
      # solana-program 2.x, см. lang/syn/src/codegen/program/idl.rs:239 в
      # v0.31.2). Наш собственный код запрещено проверять этим флагом: вызовы
      # `AccountInfo::realloc` в программе ловит tripwire-тест
      # security-guards.test.mjs. Убрать `-A deprecated` можно после апгрейда
      # Anchor, в котором кодоген перейдёт на `resize()`.
      - name: cargo clippy strict (blocking, F-22)
        run: ./scripts/ci-run.sh cargo clippy --locked -p solana_potato --all-targets -- -D warnings -A deprecated
      # Диагностический шаг: лог-архив джобы недоступен из API-only окружений,
      # а excerpt от ci-run.sh обрезан — без этой инвентаризации lint-долг
      # невозможно разобрать. Шаг всегда зелёный, данные идут в аннотации
      # (пути и имена линтов, без исходников). Здесь `-D warnings` без
      # `-A deprecated` намеренно: если deprecated-вызов появится в нашем коде,
      # он будет виден в инвентаре, хотя гейт выше его и пропускает.
      - name: Clippy inventory (bounded annotation, F-18)
        if: ${{ !cancelled() }}
        run: |
          set +e -o pipefail
          cargo clippy --locked -p solana_potato --all-targets --message-format=json -- -D warnings | python3 scripts/clippy-inventory.py
          exit 0
      - name: Anchor build (lockfile verified)
        id: build_program
        run: ./scripts/ci-run.sh ./scripts/build-program.sh
      - name: Public IDL recovery metadata
        run: python3 scripts/publish-idl-annotation.py
      - name: Clean localnet integration / deployment smoke
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
          ./scripts/ci-run.sh python3 scripts/run-anchor-test.py
      - name: Legacy migration fixtures on isolated localnet
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.build_program.outcome == 'success' }}
        run: ./scripts/ci-run.sh yarn test:migrations
      - name: IDL and program IDs match source and build
        if: ${{ !cancelled() && hashFiles('game/target/idl/solana_potato.json') != '' }}
        run: yarn check:contract target/idl/solana_potato.json
      # Never publish logs to a git branch or PR comment. GitHub job logs remain
      # the diagnostic channel; never pass production keys to this workflow.
      - name: Build artifacts (no deploy keypair)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: program-build
          retention-days: 7
          if-no-files-found: ignore
          path: |
            game/target/deploy/solana_potato.so
            game/target/idl/solana_potato.json
            game/target/types/solana_potato.ts

  # The public landing had no CI job at all before the production-deploy pass:
  # a broken build or a failed i18n-parity test surfaced only at deploy time.
  landing:
    name: Landing (typecheck, i18n parity, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Production dependencies are audited; high/critical advisories block.
      # Any moderate findings stay visible in the output for review.
      - name: Dependency audit — high/critical (blocking)
        run: npm audit --omit=dev --audit-level=high

  # The thing you deploy is not the repository. A .env can be absent from Git
  # and still land in dist/, a source map can come back with a Vite upgrade,
  # and a dependency can silently reintroduce a third-party CDN request. None
  # of that is visible in a code review; all of it is visible here (§1.3.5,
  # §2.2, §2.3, §2.5, §4.6).
  release-artifacts:
    name: Build output gate (no secrets, maps or CDN in dist/)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The workflow-level default is `game`; this job needs the repository root
    # because it inspects two build directories. Without this override every
    # step below ran in game/ and `node scripts/...` failed with
    # "Cannot find module" — the exact failure seen in run 36374174162.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm install --global yarn@1.22.22
      - name: Build landing
        working-directory: landing
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build game client
        working-directory: game
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn workspace web build
      - name: Inspect the build output
        working-directory: .
        run: node scripts/check-release-artifacts.mjs landing/dist game/apps/web/dist
      - name: Secret-scan the build output (§1.3.5)
        working-directory: .
        run: |
          node scripts/secret-scan.mjs --root landing/dist
          node scripts/secret-scan.mjs --root game/apps/web/dist

  container:
    name: Backend container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build from the repository root (includes the local Solana backport)
        working-directory: .
        shell: bash
        run: |
          set -uo pipefail
          build_log="$RUNNER_TEMP/backend-container-build.log"
          if docker build --progress=plain -f game/apps/backend/Dockerfile . >"$build_log" 2>&1; then
            cat "$build_log"
          else
            status=$?
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              printf '::error title=Backend container build detail::%s\n' "$line"
            done < <(tail -n 30 "$build_log")
            exit "$status"
          fi

  shell-scripts:
    name: Shell scripts (shellcheck, errors and warnings)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Workflow-level default is `game`; this gate must also see root-level
    # scripts/ (monitoring-alert.sh, check-headers.sh, deploy helpers).
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # shellcheck 0.9.0 is preinstalled on the ubuntu-24.04 runner image
      # (actions/runner-images Ubuntu2404-Readme.md) — no download step, so the
      # gate cannot silently skip when a CDN is unreachable.
      #
      # Why this gate exists: ops scripts (mainnet deploy, preflight, probes,
      # monitoring alerts) were checked only by `bash -n`, which misses
      # unquoted expansions, unreachable `cd` failures and unused variables —
      # exactly the class of bug that turns a deploy guard into decoration.
      # `-S warning` = real defects; info/note findings are style and stay out.
      - name: ShellCheck (tracked *.sh)
        run: shellcheck -S warning $(git ls-files '*.sh')
