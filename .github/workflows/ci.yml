name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: '4.2.2'
  ANCHOR_VERSION: '0.31.2'

defaults:
  run:
    working-directory: game
    shell: bash

jobs:
  offchain:
    name: Web + backend (typecheck, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: game/yarn.lock
      - run: npm install --global yarn@1.22.22
      - run: ./scripts/ci-local.sh --skip-chain

  program:
    name: Anchor program (build + unit + integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: game/yarn.lock
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Install pinned Solana CLI
        run: |
          curl -fsSL "https://release.anza.xyz/v${SOLANA_VERSION}/install" -o /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install pinned Anchor CLI
        run: cargo install anchor-cli --version "=$ANCHOR_VERSION" --locked
      - name: Verify toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = '1.97.1'
          test "$(solana --version | awk '{print $2}')" = "$SOLANA_VERSION"
          test "$(anchor --version | awk '{print $2}')" = "$ANCHOR_VERSION"
      - name: Unit tests (host)
        run: cargo test --locked -p solana_potato --lib
      - name: Anchor build (locked)
        run: anchor build -- --locked
      - name: Clean localnet integration / deployment smoke
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
          anchor test --skip-build
      - name: IDL and program IDs match source and build
        if: ${{ !cancelled() && hashFiles('game/target/idl/solana_potato.json') != '' }}
        run: yarn check:contract target/idl/solana_potato.json
      # Never publish logs to a git branch or PR comment. GitHub job logs remain
      # the diagnostic channel; never pass production keys to this workflow.
      - name: Build artifacts (no deploy keypair)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: program-build
          retention-days: 7
          if-no-files-found: ignore
          path: |
            game/target/deploy/solana_potato.so
            game/target/idl/solana_potato.json
            game/target/types/solana_potato.ts

  container:
    name: Backend container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/backend/Dockerfile .
