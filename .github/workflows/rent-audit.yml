name: Rent audit

# Измерительный контур стоимости деплоя (reports/rent-audit/). Отдельный файл:
# существующие workflow не правим (R13). Только чтение devnet; ключей, секретов
# и транзакций здесь нет (R2). Наружу уходят только публичные данные (R11).
#
# workflow_dispatch срабатывает лишь для файлов в default-ветке, поэтому
# основной путь — push в main/arena/** и pull_request по списку paths.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'game/programs/**'
      - 'game/Cargo.toml'
      - 'game/Anchor.toml'
      - 'game/scripts/build-program.sh'
      - 'game/scripts/ci-metrics.py'
      - 'game/scripts/probe-devnet.sh'
      - 'game/scripts/deploy-budget.mjs'
      - 'game/scripts/calibrate-localnet.mjs'
      - 'game/scripts/rent-audit.config.json'
      - '.github/workflows/rent-audit.yml'
  pull_request:
    paths:
      - 'game/programs/**'
      - 'game/Cargo.toml'
      - 'game/Anchor.toml'
      - 'game/scripts/build-program.sh'
      - 'game/scripts/ci-metrics.py'
      - 'game/scripts/probe-devnet.sh'
      - 'game/scripts/deploy-budget.mjs'
      - 'game/scripts/calibrate-localnet.mjs'
      - 'game/scripts/rent-audit.config.json'
      - '.github/workflows/rent-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rent-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: '4.2.2'
  ANCHOR_VERSION: '0.31.2'

defaults:
  run:
    working-directory: game
    shell: bash

jobs:
  # Чтение состояния кластера: ставка rent, ProgramData, баланс деплоера,
  # буферы, легаси-программа, счётчики аккаунтов игры. Без ключей.
  probe-devnet:
    name: "Rent audit: probe devnet"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Solana CLI
        run: |
          curl -fsSL "https://release.anza.xyz/v${SOLANA_VERSION}/install" -o /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Probe devnet (read-only)
        run: ./scripts/probe-devnet.sh
      # SETUP_ONCHAIN: разовые расходы init-onchain по факту кластера (какие
      # аккаунты уже существуют). Заодно — smoke-тест RPC-пути калькулятора.
      - name: SETUP_ONCHAIN (init-onchain accounts, measured)
        # Код 3 (деплоеру не хватает SOL) — нормальный результат измерения, не сбой.
        # Сбой = нет JSON: тогда печатаем текст ошибки аннотацией (логи CI недоступны).
        run: |
          set +e
          node scripts/deploy-budget.mjs --so-len 0 --mode init-only --json > /tmp/init-only.json 2> /tmp/init-only.err
          code=$?
          set -e
          if [ ! -s /tmp/init-only.json ]; then
            echo "::error title=ares-setup-error::exit=$code $(tail -c 500 /tmp/init-only.err | tr '\n' ' ')"
            exit 1
          fi
          echo "$code" > /tmp/init-only.code
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/init-only.json'))
          payload = {
              'setupOnchain': data['setupOnchain'],
              'setupParts': data['setupParts'],
              'needTotalInitOnly': data['needTotal'],
              'rate': data['rate'],
              'rpc': data['rpc'],
              'deployerBalance': data['balance'],
              'cliExit': int(open('/tmp/init-only.code').read().strip()),
          }
          print('::notice title=ares-setup::' + json.dumps(payload, separators=(',', ':'), ensure_ascii=True))
          PY

  # Матрица размеров `.so` по opt-level. Сборка тем же скриптом, что в ci.yml
  # (build-program.sh запрещает любое изменение Cargo.lock). Переменная профиля
  # Cargo.lock не меняет: CARGO_PROFILE_RELEASE_OPT_LEVEL переопределяет
  # [profile.release] из Cargo.toml только на время сборки.
  size-matrix:
    name: "Rent audit: size ${{ matrix.opt }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        opt: [base, '3', s, z]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - name: Install pinned Solana CLI
        run: |
          curl -fsSL "https://release.anza.xyz/v${SOLANA_VERSION}/install" -o /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: anchor-cache
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ env.ANCHOR_VERSION }}
      - name: Install pinned Anchor CLI
        run: |
          if ! command -v anchor >/dev/null || [[ "$(anchor --version | awk '{print $2}')" != "$ANCHOR_VERSION" ]]; then
            cargo install anchor-cli --version "=$ANCHOR_VERSION" --locked
          fi
      - uses: actions/cache/save@v4
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ steps.anchor-cache.outputs.cache-primary-key }}
      - name: Verify toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = '1.97.1'
          test "$(solana --version | awk '{print $2}')" = "$SOLANA_VERSION"
          test "$(anchor --version | awk '{print $2}')" = "$ANCHOR_VERSION"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game
          cache-on-failure: true
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-opt-${{ matrix.opt }}
      - name: Build program (opt-level ${{ matrix.opt }})
        env:
          OPT: ${{ matrix.opt }}
        run: |
          # `base` — как в Cargo.toml (неявный opt-level=3): контроль, что env-var
          # действительно управляет профилем, — совпадение sha256 с вариантом `3`.
          if [ "$OPT" = "base" ]; then
            ./scripts/build-program.sh
          else
            CARGO_PROFILE_RELEASE_OPT_LEVEL="$OPT" ./scripts/build-program.sh
          fi
      - name: Program size metrics (annotation ares-so-${{ matrix.opt }})
        if: ${{ !cancelled() }}
        run: python3 scripts/ci-metrics.py --variant '${{ matrix.opt }}'
      - name: Record lockfile unchanged
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- Cargo.lock || {
            echo '::error title=ares-lockfile::Cargo.lock изменился при сборке — измерение недействительно'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: so-${{ matrix.opt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            game/target/deploy/solana_potato.so
            game/target/idl/solana_potato.json

  # Калибровка §5.7: модель залога проверяется на живом solana-test-validator
  # (одноразовые ключи, localnet — исключение из R2). Расхождение хотя бы на
  # 1 лампорт валит job: по брифу это СТОП-условие, а не «шум».
  calibrate-localnet:
    name: "Rent audit: calibrate localnet"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [size-matrix]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Solana CLI
        run: |
          curl -fsSL "https://release.anza.xyz/v${SOLANA_VERSION}/install" -o /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Download the reference build (so-base)
        uses: actions/download-artifact@v4
        with:
          name: so-base
          path: game/target
      - name: Verify toolchain and artifact
        run: |
          test "$(solana --version | awk '{print $2}')" = "$SOLANA_VERSION"
          # download-artifact кладёт файлы от общего предка — нормализуем путь, если он другой.
          if [ ! -s target/deploy/solana_potato.so ]; then
            found="$(find . -name 'solana_potato.so' -not -path './target/*' -print -quit)"
            [ -n "$found" ] && mkdir -p target/deploy && cp "$found" target/deploy/solana_potato.so
          fi
          test -s target/deploy/solana_potato.so
          stat -c '%s bytes %n' target/deploy/solana_potato.so
      - name: Start solana-test-validator (localnet only)
        run: |
          solana-test-validator --reset --quiet --ledger /tmp/calib-ledger > /tmp/validator.log 2>&1 &
          for i in $(seq 1 60); do
            solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1 && break
            sleep 1
          done
          solana cluster-version --url http://127.0.0.1:8899
      - name: Calibrate (annotation ares-calibrate)
        run: node scripts/calibrate-localnet.mjs --so target/deploy/solana_potato.so --out /tmp/calibrate-report.json
      - name: Upload calibration report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: calibrate-report
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/calibrate-report.json
      - name: Validator log on failure
        if: ${{ failure() }}
        run: tail -50 /tmp/validator.log || true
