name: Arena prod check (temporary)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0efbd-ares1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install playwright + chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Compare production builds with the merged main build
        run: node .ci/prod-check.mjs

      - name: Publish result into the job log
        if: always()
        run: |
          test -f .ci/out/prod-check.txt && cat .ci/out/prod-check.txt || echo "no output"

      - name: Commit result back to the branch
        if: always()
        run: |
          git config user.name "arena-prod-check"
          git config user.email "arena-prod-check@users.noreply.github.com"
          git add -f .ci/out
          git commit -m "chore(ci): prod check output" || echo "nothing to commit"
          git push
