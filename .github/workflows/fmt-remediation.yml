name: Fmt remediation (one-shot)

# Инструмент F-22: «Устранить долг целиком: cargo fmt --all, затем снять baseline»
# (комментарий гейта в ci.yml). Запускается вручную ТОЛЬКО на ветку, которую
# согласовано привести в rustfmt-формат:
#
#   gh workflow run fmt-remediation.yml --ref <ветка>
#
# Работает: cargo fmt --all (workspace game/ = programs/*) → commit → push в
# запуснутую ветку. Никаких других правок не делает. После применения baseline-
# гейт в ci.yml меняется на строгий `cargo fmt --all -- --check`.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fmt-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-push:
    name: cargo fmt --all + push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, pinned (was @master)
        with:
          toolchain: '1.97.1' # тот же пин, что в ci.yml (sчёт fmt детерминирован)
          components: rustfmt
      - name: Format program workspace
        run: cargo fmt --all
        working-directory: game
      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- game/; then
            echo "Nothing to format — no commit."
            exit 0
          fi
          git diff --stat -- game/ | tail -5
          git config user.name "ARES-1 CI"
          git config user.email "ares1-ci@users.noreply.github.com"
          git add game/
          git commit -m "chore(program): cargo fmt --all — закрываем F-22 fmt-долг целиком"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Pushed formatting commit to ${GITHUB_REF_NAME}."
