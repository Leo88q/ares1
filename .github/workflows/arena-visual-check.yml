name: Arena visual check (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0efbd-ares1

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install playwright + chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Capture screenshots and CSS diagnostics
        run: node .ci/visual-check.mjs

      - name: Publish diagnostics into the job log
        if: always()
        run: |
          test -f .ci/out/summary.txt && cat .ci/out/summary.txt || echo "no summary"

      - name: Commit screenshots back to the branch
        if: always()
        run: |
          git config user.name "arena-visual-check"
          git config user.email "arena-visual-check@users.noreply.github.com"
          git add -f .ci/out
          git commit -m "chore(ci): visual check output" || echo "nothing to commit"
          git push
