name: Watchtower exporter
# Last verified: 2026-09-24 — local suite 99/99 + SW016 inventory 21/21
# against reports/ares1-audit.{json,md} regenerated in cf8d141 (F-12/SW016 rule).
on:
  push:
    branches: [main, 'arena/**']
    paths: ['watchtower/**', '.github/workflows/watchtower.yml', 'game/apps/web/src/idl.json', 'WATCHTOWER_INTEGRATION.md', 'WATCHTOWER_OS_V3_FINAL_REPORT.md']
  pull_request:
    paths: ['watchtower/**', '.github/workflows/watchtower.yml', 'game/apps/web/src/idl.json', 'WATCHTOWER_INTEGRATION.md', 'WATCHTOWER_OS_V3_FINAL_REPORT.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchtower-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readonly-exporter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchtower_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d watchtower_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI-only service. Never point these destructive tests at game data.
      WATCHTOWER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/watchtower_test
      WATCHTOWER_REQUIRE_TEST_DATABASE: 'true'
    defaults:
      run:
        working-directory: watchtower
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: watchtower/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test ../game/scripts/audit-init-if-needed.test.mjs
      # Security-guard tripwire (чек-листы аудита 2026-09-25 / 2026-09-26).
      - run: node --test ../game/scripts/security-guards.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node --test tests/address-registry.test.mjs
      - run: npm run test:os
      - run: npm run os:handoff:check

  # Живой devnet-smoke экспортёра (read-only). Handoff 2026-10-06 называет
  # «сертифицированный devnet-smoke» блокером интеграции — этот job его
  # реально выполняет при каждом изменении watchtower/**: миграция схемы,
  # запуск экспортёра (rpc-провайдер, публичный devnet RPC, postgres-service)
  # и сверка событий, декодированных офлайн, с тем, что экспортёр фактически
  # инжестил (verify:devnet). NO_KNOWN_APPLIED_EVENT (нет трафика по программе)
  # — не регрессия, публикуется warning; любой другой исход — красный.
  # Подробности и локальный запуск: watchtower/docs/devnet-smoke.md.
  devnet-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchtower_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d watchtower_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/watchtower_test
      SMOKE_RPC_URL: https://api.devnet.solana.com
    defaults:
      run:
        working-directory: watchtower
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: watchtower/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # shell: bash БЕЗ -e: все ошибки обрабатываются явно, и в любом исходе
      # step доносит диагностику аннотациями (log-архив недоступен из API-only
      # окружений — аннотации единственный канал).
      - name: devnet smoke (readyz + verify:devnet)
        shell: bash
        run: |
          set -uo pipefail
          export WATCHTOWER_EVENT_PROVIDER=rpc
          export WATCHTOWER_RPC_URL="$SMOKE_RPC_URL"
          export WATCHTOWER_DATABASE_URL="$SMOKE_DATABASE_URL"
          export WATCHTOWER_EXPORTER_TOKEN="$(openssl rand -hex 24)"
          export WATCHTOWER_ENABLE_WRITES=false
          export WATCHTOWER_POLL_MS=5000
          publish() {
            # $1 = notice|warning|error, $2 = текст (обрезка под лимит 4096).
            echo "::${1} file=watchtower/scripts/verify-devnet.ts::devnet-smoke: $(tr '\n' ' ' <<< "$2" | head -c 3500)"
          }
          if ! npm run migrate > /tmp/migrate.out 2>&1; then
            publish error "migrate failed: $(cat /tmp/migrate.out | tail -20)"
            exit 1
          fi
          publish notice "migrate OK; старт экспортёра (rpc, $SMOKE_RPC_URL, pollMs=5000)"
          nohup npm run dev > /tmp/exporter.log 2>&1 &
          export EXPORTER_PID=$!
          trap 'kill "$EXPORTER_PID" 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 36); do
            code="$(curl -s -o /tmp/readyz.json -w '%{http_code}' -H "Authorization: Bearer $WATCHTOWER_EXPORTER_TOKEN" "http://127.0.0.1:8790/watchtower/readyz" 2>/dev/null || true)"
            if [ "$code" = "200" ]; then ready="$i"; break; fi
            if ! kill -0 "$EXPORTER_PID" 2>/dev/null; then
              publish error "процесс экспортёра умер: $(tail -40 /tmp/exporter.log)"
              exit 1
            fi
            if [ $((i % 6)) -eq 0 ]; then
              publish notice "ожидание readyz ${i}x5s — HTTP ${code:-?} $(head -c 400 /tmp/readyz.json 2>/dev/null || true)"
            fi
            sleep 5
          done
          npm run verify:devnet > /tmp/verify.out 2>&1
          vstatus=$?
          cat /tmp/verify.out
          if [ -n "$ready" ] && [ "$vstatus" -eq 0 ] && grep -q 'runtime_smoke_pass' /tmp/verify.out; then
            publish notice "PASS (readyz за ${ready}x5s) — $(cat /tmp/verify.out | head -c 900)"
            exit 0
          fi
          if grep -q 'NO_KNOWN_APPLIED_EVENT' /tmp/verify.out; then
            publish warning "по программе нет трафика с известными событиями (NO_KNOWN_APPLIED_EVENT) — не регрессия; повторится на следующем изменении watchtower/**"
            exit 0
          fi
          publish error "FAIL (ready=${ready:-no}, vstatus=$vstatus) — verify: $(cat /tmp/verify.out | head -c 900)"
          publish error "exporter log: $(tail -60 /tmp/exporter.log)"
          exit 1
