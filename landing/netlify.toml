# ARES-1 landing — build configuration.
#
# §2.1: `publish = "dist"` — only the build output is deployed. The repository
# root (docs, scripts, .github, the game workspace) is never served.
#
# HEADERS AND REDIRECTS DO NOT LIVE HERE — see public/_headers and
# public/_redirects.
#
# This site is actually deployed by Cloudflare Pages (the "Cloudflare Pages:
# ares1" check runs on every PR), and Cloudflare Pages ignores netlify.toml
# completely. Header and redirect rules that lived only in this file were
# therefore silently never applied. `_headers` and `_redirects` in the published
# directory are understood by BOTH platforms, so they are now the single source
# of truth. This file keeps only what is genuinely Netlify-specific: the build
# command, the publish directory and the Node version.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
