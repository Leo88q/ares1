<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Модули колонии — прототип</title>
    <script>
      // Диагностика: любая необработанная ошибка рисуется на экране (не молчим)
      window.addEventListener('error', function (e) {
        function show(text) {
          var el = document.getElementById('jserr');
          if (!el) {
            el = document.createElement('div');
            el.id = 'jserr';
            el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#3a1010;color:#ffb4b4;border:1px solid #e05f5f;border-radius:10px;padding:10px 14px;font:12px/1.45 Menlo,monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;';
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent = text;
        }
        show('JS ERROR: ' + (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + '\n' + ((e.error && e.error.stack) ? String(e.error.stack).split('\n').slice(0, 5).join('\n') : ''));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
