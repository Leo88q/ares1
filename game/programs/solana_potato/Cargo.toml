[package]
name = "solana_potato"
version = "0.2.0"
description = "Solana Potato game program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_potato"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Experimental CPI integrations are not implemented. Do not resolve unused
# legacy SDKs here: Cargo resolves optional dependencies even in default builds.

[dependencies]
anchor-lang = { version = "=0.31.2", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.2", features = ["token", "associated_token"] }
