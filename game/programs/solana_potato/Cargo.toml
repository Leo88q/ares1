[package]
name = "solana_potato"
version = "0.2.0"
description = "Solana Potato game program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_potato"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Full prod build with all advanced features (ZK compression, Bubblegum, Metaplex Core)
full = ["spl-account-compression", "mpl-bubblegum", "mpl-core", "light-compressed-pda"]

[dependencies]
anchor-lang = { version = "0.31.2", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.2", features = ["token", "associated_token", "token_2022", "metadata"] }
# ── Advanced Solana tech: compression, Token-2022, Metaplex Core ──
spl-account-compression = { version = "0.4.1", optional = true }
mpl-bubblegum = { version = "2.0.1", optional = true }
mpl-core = { version = "0.10.1", optional = true }
light-compressed-pda = { version = "0.3.1", optional = true }
